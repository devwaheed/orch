name: Release

# Push a tag like v1.0.0 (latest) or v1.0.0-beta.1 (beta, REL-01) to build every
# installer (REL-03) and publish it to GitHub Releases on devwaheed/orch, where the
# app's updater looks (REL-02). See docs/release.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac dmg --universal
          - os: windows-latest
            platform: win
            args: --win nsis --x64
          - os: ubuntu-22.04
            platform: linux
            args: --linux AppImage deb --x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the app version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd packages/app && npm pkg set version="$version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # A prerelease part (1.0.0-beta.1) publishes a GitHub prerelease on the beta channel.
          if [[ "$version" == *-* ]]; then echo "EP_PRE_RELEASE=true" >> "$GITHUB_ENV"; fi

      - name: Build packages
        run: |
          pnpm --filter @orchagents/workbench build
          pnpm --filter @orchagents/app run build:electron

      - name: Build and publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing turns on when these secrets exist (S5-02); without them the build is unsigned.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          signed=yes
          if [[ "${{ matrix.platform }}" == mac && -z "$CSC_LINK" ]] || [[ "${{ matrix.platform }}" == win && -z "$WIN_CSC_LINK" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            signed=no
          fi
          pnpm --filter @orchagents/app exec electron-builder ${{ matrix.args }} --publish always --config electron-builder.config.cjs
          if [[ "${{ matrix.platform }}" != linux && "$signed" == no ]]; then
            echo "⚠️ orch $VERSION for ${{ matrix.platform }} is **unsigned**: add the signing secrets listed in docs/release.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            packages/app/dist/release/*.dmg
            packages/app/dist/release/*.exe
            packages/app/dist/release/*.AppImage
            packages/app/dist/release/*.deb
            packages/app/dist/release/*.yml
          if-no-files-found: warn
